<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="theme-color" content="#0E0805">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Host+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(.16 .012 55);--surf:oklch(.2 .02 55 / .6);--ink:oklch(.93 .03 88);--hi:oklch(.88 .08 90);--acc:oklch(.73 .1 78);--white:oklch(.93 .03 88);--line:oklch(.88 .08 90 / .2);--r:18px;--pad:clamp(1rem,3vw,2.4rem);--d:"Playfair Display",Georgia,serif;--b:"Host Grotesk","Helvetica Neue",Arial,sans-serif;--s:"Playfair Display",Georgia,serif;--sc:"Pinyon Script",cursive;--m:"Host Grotesk",sans-serif;interpolate-size:allow-keywords}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--b);overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased;hyphens:auto}
a{color:inherit;text-underline-offset:.2em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:scale 150ms ease-out,background .25s}
button:active,.btn:active{scale:.97}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.theme-switching *{transition:none!important}
#pre{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-end;padding:var(--pad);transition:opacity .7s}
#pre.out{opacity:0;pointer-events:none}
#pre span{font:500 clamp(5rem,22vw,16rem)/.8 var(--d);color:var(--hi);font-variant-numeric:tabular-nums}
#pre i{font:600 2rem var(--d);margin:0 0 .4rem .6rem;font-style:normal}
.nav{--p:.375rem;position:fixed;z-index:20;top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad);display:flex;gap:.15rem;padding:var(--p)}
.nav a{display:inline-grid;font:500 .95rem var(--b);text-decoration:none;padding:.5rem .9rem;border-radius:calc(var(--r) - var(--p));color:var(--ink);transition:color .25s,background .25s;text-box:trim-both cap alphabetic}
.nav a::after{content:attr(data-text);grid-area:1/1;font-weight:700;visibility:hidden;height:0;overflow:hidden}
.nav a:hover,.nav a.cur{color:var(--white);background:oklch(.68 .13 62 / .24)}
.nav a.cur{font-weight:700}
.dots{position:fixed;z-index:20;right:var(--pad);top:50%;transform:translateY(-50%);list-style:none;display:grid;gap:.9rem}
.dots button{width:.6rem;height:.6rem;border-radius:50%;border:1px solid var(--hi);display:block;transition:transform .3s,background .3s}
.dots button.cur{background:var(--hi);transform:scale(1.4)}
.ov{position:fixed;z-index:10;pointer-events:none;opacity:0;visibility:hidden}
.ov a,.ov button{pointer-events:auto}
.eyebrow{font:400 .85rem var(--m);color:var(--hi);margin-bottom:.6rem}
.hero{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad)}
.hero h1{font:500 clamp(3.4rem,13vw,11rem)/.88 var(--d);letter-spacing:-.045em;color:var(--white);text-wrap:balance}
.hero p#tagline{max-width:32rem;margin-top:1.2rem;font-size:1.2rem;text-wrap:pretty}
.hint{margin-top:1.4rem;font:400 .8rem var(--m);color:var(--hi);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.cap{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));max-width:min(34rem,90vw)}
.cap h2{font:500 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.045em;color:var(--white);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cap #ctags{margin:.7rem 0 1.1rem;font:400 .85rem var(--m);color:var(--hi)}
.btn{display:inline-block;padding:.75rem 1.3rem;font:600 .95rem var(--d);text-decoration:none;transition:scale 150ms ease-out,background .25s;text-box:trim-both cap alphabetic}
.btn:hover{background:oklch(.68 .13 62 / .38)}
.about{--p:1.6rem;right:calc(var(--pad) + 2rem);top:50%;transform:translateY(-50%);width:min(30rem,calc(100vw - 2*var(--pad)));padding:var(--p)}
.about h2,.contact h2{font:500 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.045em;color:var(--white);margin-bottom:1rem}
.about p{margin-bottom:.9rem}.about ul{list-style:none;margin:.5rem 0 1rem;font-size:.95rem}
.about li{padding:.35rem 0;border-top:1px solid var(--line)}
.about h3{font:500 .85rem var(--m);color:var(--hi);margin-top:1rem}
.contact{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(60rem,92vw)}
.contact .big{display:inline-block;font:500 clamp(2rem,1rem + 5vw,4rem)/1.1 var(--d);letter-spacing:-.045em;color:var(--white);text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--acc);overflow-wrap:anywhere;margin:.6rem 0 1.6rem}
.contact .big:hover{color:var(--hi)}
.soc{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.soc a{padding:.65rem 1.2rem;font:600 .9rem var(--d);text-decoration:none;text-box:trim-both cap alphabetic}
.modal{position:fixed;inset:0;z-index:50;background:oklch(.11 .015 55 / .9);backdrop-filter:blur(10px);overflow:auto;padding:calc(4.5rem + env(safe-area-inset-top,0px)) var(--pad) 3rem;touch-action:pan-y;animation:enter .35s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;scale:.97}}
.modal[hidden]{display:none}
.modal .in{max-width:62rem;margin:0 auto}
.modal h2{font:500 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.045em;color:var(--white);margin-bottom:.8rem}
.modal p.t{max-width:40rem;font-size:1.15rem;margin:.8rem 0 1.2rem;text-wrap:pretty}
.modal .shots{display:grid;gap:1rem;margin-top:1.6rem}
.modal .shots div{aspect-ratio:16/10;border-radius:var(--r);background:linear-gradient(135deg in oklch,oklch(.26 .05 55),oklch(.62 .13 75));border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:oklch(1 0 0 / .4);font:500 3rem var(--d)}
.modal img{width:100%;height:100%;object-fit:cover;display:block}
.modal .x{position:fixed;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);padding:.6rem 1.1rem;font:600 .9rem var(--d);text-box:trim-both cap alphabetic}
.sr{position:absolute;left:-9999px}
.nogl,.nogl body{overflow:auto;touch-action:auto;height:auto}
.nogl #gl,.nogl .dots,.nogl .nav{display:none}
.nogl .ov{position:static;opacity:1!important;visibility:visible!important;transform:none!important;padding:3rem var(--pad)}
.nogl .cap{display:none}.nogl .sr{position:static;padding:0 var(--pad) 3rem;list-style:none}
@media (max-width:760px){.about{right:var(--pad);top:auto;bottom:calc(var(--pad) + 3rem);transform:none}.dots{display:none}.nav a{padding:.45rem .6rem;font-size:.85rem}}
.hero p#tagline{font:italic 400 clamp(1.3rem,1rem + 1.4vw,2rem)/1.2 var(--s);color:var(--white);max-width:30rem}
.cap{--p:1.3rem;padding:var(--p);border-radius:var(--r);background:var(--surf);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;-webkit-mask-composite:source-over}
.cap .admit{font:500 .75rem var(--m);color:var(--hi);letter-spacing:.14em;text-transform:uppercase;padding-bottom:.7rem;margin-bottom:.8rem;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}
.cap #ctags{font:italic 400 1.1rem var(--s)}
.calm{position:fixed;z-index:20;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);padding:.7rem 1.1rem;font:500 .85rem var(--d);text-box:trim-both cap alphabetic}
.calm[aria-pressed=true]{background:oklch(.68 .13 62 / .3)}
.nogl .calm{display:none}
@media (max-width:760px){.calm{top:auto;bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hero h1{font-style:italic;font-weight:400;color:var(--acc);opacity:.95}
.hero p#tagline,.hint{font-family:var(--s)}
.nav a,.btn,.soc a,.calm,.modal .x{font-family:var(--b)}
.eyebrow,.about h3,.cap .admit{letter-spacing:.2em;text-transform:uppercase;font-size:.72rem}
.about h2,.contact h2,.modal h2,.cap h2{font-weight:500}
/* gold ticket, as on leborrel.nl */
.cap{mask:none;-webkit-mask:none;rotate:-2deg;--p:1.5rem;padding:var(--p);border:0;border-radius:6px;background:linear-gradient(140deg in oklch,oklch(.8 .08 82),oklch(.92 .06 88) 48%,oklch(.7 .09 78));color:oklch(.27 .04 65);box-shadow:0 25px 65px oklch(0 0 0 / .35);backdrop-filter:none;position:fixed}
.cap::before{content:"";position:absolute;inset:11px;border:1px solid oklch(.42 .06 65 / .35);border-radius:2px;pointer-events:none}
.cap .admit{color:oklch(.35 .05 65);border-bottom-color:oklch(.42 .06 65 / .45)}
.cap h2{color:oklch(.25 .04 65)}
.cap #ctags{font:400 clamp(1.5rem,1.2rem + 1vw,2rem)/1 var(--sc);color:oklch(.32 .05 65)}
.cap .btn{background:oklch(.2 .02 55);color:oklch(.93 .03 88);border:0;border-radius:calc(6px + 2px)}
.cap .btn:hover{background:oklch(.28 .03 55)}
.about h2 em,.contact h2 em{font-family:var(--sc);font-style:normal;color:var(--hi);font-size:1.25em}
.modal .t{font-family:var(--b)}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="pre" aria-hidden="true"><span id="pn">0</span><i>%</i><p style="margin:0 0 .6rem auto;font:italic 400 1.4rem var(--s)">Setting the stage</p></div>
<nav class="glass nav" id="nav" aria-label="Main"></nav>
<button class="glass calm" id="calm" aria-pressed="false">Calm mode</button>
<ul class="dots" id="dots" aria-label="Sections"></ul>

<section class="ov hero" id="hero"><p class="eyebrow" id="role"></p><h1 id="name"></h1><p id="tagline"></p><p class="hint">Scroll to explore</p></section>
<section class="ov cap" id="cap"><p class="admit"><span>Admit one</span><span id="cmeta"></span></p><h2 id="ctitle"></h2><p id="ctags"></p><button class="btn glass" id="copen">View project</button></section>
<section class="ov about glass" id="about"></section>
<section class="ov contact" id="contact"></section>
<ul class="sr" id="sr"></ul>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Project">
  <button class="x glass" id="mx">Close</button><div class="in" id="min"></div>
</div>

<script src="content.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
