<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="theme-color" content="#0a1226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(.16 .045 262);--surf:oklch(.26 .06 260 / .42);--ink:oklch(.86 .05 255);--hi:oklch(.74 .12 248);--acc:oklch(.65 .19 258);--white:oklch(.96 .02 255);--line:oklch(.74 .12 248 / .3);--r:18px;--pad:clamp(1rem,3vw,2.4rem);--d:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--b:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace;interpolate-size:allow-keywords}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--b);overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased;hyphens:auto}
a{color:inherit;text-underline-offset:.2em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:scale 150ms ease-out,background .25s}
button:active,.btn:active{scale:.97}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.theme-switching *{transition:none!important}
#pre{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-end;padding:var(--pad);transition:opacity .7s}
#pre.out{opacity:0;pointer-events:none}
#pre span{font:700 clamp(5rem,22vw,16rem)/.8 var(--d);color:var(--hi);font-variant-numeric:tabular-nums}
#pre i{font:600 2rem var(--d);margin:0 0 .4rem .6rem;font-style:normal}
.nav{--p:.375rem;position:fixed;z-index:20;top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad);display:flex;gap:.15rem;padding:var(--p)}
.nav a{display:inline-grid;font:500 .95rem var(--d);text-decoration:none;padding:.5rem .9rem;border-radius:calc(var(--r) - var(--p));color:var(--ink);transition:color .25s,background .25s;text-box:trim-both cap alphabetic}
.nav a::after{content:attr(data-text);grid-area:1/1;font-weight:700;visibility:hidden;height:0;overflow:hidden}
.nav a:hover,.nav a.cur{color:var(--white);background:oklch(.65 .19 258 / .22)}
.nav a.cur{font-weight:700}
.dots{position:fixed;z-index:20;right:var(--pad);top:50%;transform:translateY(-50%);list-style:none;display:grid;gap:.9rem}
.dots button{width:.6rem;height:.6rem;border-radius:50%;border:1px solid var(--hi);display:block;transition:transform .3s,background .3s}
.dots button.cur{background:var(--hi);transform:scale(1.4)}
.ov{position:fixed;z-index:10;pointer-events:none;opacity:0;visibility:hidden}
.ov a,.ov button{pointer-events:auto}
.eyebrow{font:400 .85rem var(--m);color:var(--hi);margin-bottom:.6rem}
.hero{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad)}
.hero h1{font:700 clamp(3.4rem,13vw,11rem)/.88 var(--d);letter-spacing:-.03em;color:var(--white);text-wrap:balance}
.hero p#tagline{max-width:32rem;margin-top:1.2rem;font-size:1.2rem;text-wrap:pretty}
.hint{margin-top:1.4rem;font:400 .8rem var(--m);color:var(--hi);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.cap{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));max-width:min(34rem,90vw)}
.cap h2{font:700 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.02em;color:var(--white);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cap #ctags{margin:.7rem 0 1.1rem;font:400 .85rem var(--m);color:var(--hi)}
.btn{display:inline-block;padding:.75rem 1.3rem;font:600 .95rem var(--d);text-decoration:none;transition:scale 150ms ease-out,background .25s;text-box:trim-both cap alphabetic}
.btn:hover{background:oklch(.65 .19 258 / .35)}
.about{--p:1.6rem;right:calc(var(--pad) + 2rem);top:50%;transform:translateY(-50%);width:min(30rem,calc(100vw - 2*var(--pad)));padding:var(--p)}
.about h2,.contact h2{font:700 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.02em;color:var(--white);margin-bottom:1rem}
.about p{margin-bottom:.9rem}.about ul{list-style:none;margin:.5rem 0 1rem;font-size:.95rem}
.about li{padding:.35rem 0;border-top:1px solid var(--line)}
.about h3{font:500 .85rem var(--m);color:var(--hi);margin-top:1rem}
.contact{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(60rem,92vw)}
.contact .big{display:inline-block;font:700 clamp(2rem,1rem + 5vw,4rem)/1.1 var(--d);letter-spacing:-.02em;color:var(--white);text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--acc);overflow-wrap:anywhere;margin:.6rem 0 1.6rem}
.contact .big:hover{color:var(--hi)}
.soc{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.soc a{padding:.65rem 1.2rem;font:600 .9rem var(--d);text-decoration:none;text-box:trim-both cap alphabetic}
.modal{position:fixed;inset:0;z-index:50;background:oklch(.13 .04 262 / .88);backdrop-filter:blur(10px);overflow:auto;padding:calc(4.5rem + env(safe-area-inset-top,0px)) var(--pad) 3rem;touch-action:pan-y;animation:enter .35s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;scale:.97}}
.modal[hidden]{display:none}
.modal .in{max-width:62rem;margin:0 auto}
.modal h2{font:700 clamp(2rem,1rem + 5vw,4rem)/1 var(--d);letter-spacing:-.02em;color:var(--white);margin-bottom:.8rem}
.modal p.t{max-width:40rem;font-size:1.15rem;margin:.8rem 0 1.2rem;text-wrap:pretty}
.modal .shots{display:grid;gap:1rem;margin-top:1.6rem}
.modal .shots div{aspect-ratio:16/10;border-radius:var(--r);background:linear-gradient(135deg in oklch,oklch(.28 .09 262),oklch(.52 .19 258));border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:oklch(1 0 0 / .4);font:700 3rem var(--d)}
.modal img{width:100%;height:100%;object-fit:cover;display:block}
.modal .x{position:fixed;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);padding:.6rem 1.1rem;font:600 .9rem var(--d);text-box:trim-both cap alphabetic}
.sr{position:absolute;left:-9999px}
.nogl,.nogl body{overflow:auto;touch-action:auto;height:auto}
.nogl #gl,.nogl .dots,.nogl .nav{display:none}
.nogl .ov{position:static;opacity:1!important;visibility:visible!important;transform:none!important;padding:3rem var(--pad)}
.nogl .cap{display:none}.nogl .sr{position:static;padding:0 var(--pad) 3rem;list-style:none}
@media (max-width:760px){.about{right:var(--pad);top:auto;bottom:calc(var(--pad) + 3rem);transform:none}.dots{display:none}.nav a{padding:.45rem .6rem;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="pre" aria-hidden="true"><span id="pn">0</span><i>%</i></div>
<nav class="glass nav" id="nav" aria-label="Main"></nav>
<ul class="dots" id="dots" aria-label="Sections"></ul>

<section class="ov hero" id="hero"><p class="eyebrow" id="role"></p><h1 id="name"></h1><p id="tagline"></p><p class="hint">Scroll to explore</p></section>
<section class="ov cap" id="cap"><p class="eyebrow" id="cmeta"></p><h2 id="ctitle"></h2><p id="ctags"></p><button class="btn glass" id="copen">View project</button></section>
<section class="ov about glass" id="about"></section>
<section class="ov contact" id="contact"></section>
<ul class="sr" id="sr"></ul>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Project">
  <button class="x glass" id="mx">Close</button><div class="in" id="min"></div>
</div>

<script src="content.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
