<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="theme-color" content="#050B1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B1A;--ink:#B5CFFF;--hi:#6BB0F9;--acc:#3D8BFF;--line:rgba(107,176,249,.35);--pad:clamp(1rem,3vw,2.4rem);--d:"Antonio","Arial Narrow",Impact,sans-serif;--b:"Inter Tight","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:300 1rem/1.55 var(--b);overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(21,48,91,.18);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

/* preloader */
#pre{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-end;padding:var(--pad);transition:opacity .7s}
#pre.out{opacity:0;pointer-events:none}
#pre span{font:700 clamp(5rem,22vw,16rem)/.8 var(--d);color:var(--hi);font-variant-numeric:tabular-nums}
#pre i{font:700 2rem var(--d);margin:0 0 .4rem .6rem;color:var(--ink);font-style:normal}

/* nav */
.nav{position:fixed;z-index:20;top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad);display:flex;gap:.2rem;padding:.35rem .5rem}
.nav a{font:600 .9rem var(--d);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:.35rem .8rem;color:var(--ink);transition:color .25s}
.nav a:hover,.nav a.cur{color:#fff;text-shadow:0 0 14px var(--acc)}
.dots{position:fixed;z-index:20;right:var(--pad);top:50%;transform:translateY(-50%);list-style:none;display:grid;gap:.9rem}
.dots button{width:.6rem;height:.6rem;border-radius:50%;border:1px solid var(--hi);display:block;transition:all .3s}
.dots button.cur{background:var(--hi);box-shadow:0 0 12px var(--acc);transform:scale(1.4)}

/* overlays */
.ov{position:fixed;z-index:10;pointer-events:none;opacity:0;visibility:hidden}
.ov a,.ov button{pointer-events:auto}
.eyebrow{font:400 .8rem var(--b);letter-spacing:.2em;text-transform:uppercase;color:var(--hi);margin-bottom:.6rem}
.hero{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad)}
.hero h1{font:700 clamp(4.2rem,17vw,15rem)/.82 var(--d);letter-spacing:-.01em;text-transform:uppercase;color:#E3EEFF;text-shadow:0 0 60px rgba(61,139,255,.35)}
.hero p#tagline{max-width:30rem;margin-top:1.2rem;font-size:1.15rem}
.hint{margin-top:1.4rem;font:400 .75rem var(--b);letter-spacing:.2em;text-transform:uppercase;color:var(--hi);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.cap{left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));max-width:min(34rem,90vw)}
.cap h2{font:700 clamp(2.6rem,8vw,6rem)/.9 var(--d);text-transform:uppercase;color:#E3EEFF}
.cap #ctags{margin:.7rem 0 1.1rem;font-size:.9rem;color:var(--hi)}
.btn{padding:.7rem 1.4rem;font:600 .9rem var(--d);letter-spacing:.16em;text-transform:uppercase;transition:background .25s}
.btn:hover{background:rgba(61,139,255,.35)}
.about{right:calc(var(--pad) + 2rem);top:50%;transform:translateY(-50%);width:min(30rem,calc(100vw - 2*var(--pad)));padding:1.6rem 1.8rem}
.about h2,.contact h2{font:700 clamp(2.4rem,6vw,4.4rem)/.9 var(--d);text-transform:uppercase;color:#E3EEFF;margin-bottom:1rem}
.about p{margin-bottom:.9rem}.about ul{list-style:none;margin:.5rem 0 1rem;font-size:.9rem}
.about li{padding:.3rem 0;border-top:1px solid var(--line)}
.about h3{font:400 .75rem var(--b);letter-spacing:.2em;text-transform:uppercase;color:var(--hi);margin-top:1rem}
.contact{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(60rem,92vw)}
.contact .big{display:inline-block;font:700 clamp(2rem,8vw,6rem)/1 var(--d);color:#E3EEFF;text-decoration:none;overflow-wrap:anywhere;border-bottom:3px solid var(--acc);margin:.6rem 0 1.4rem}
.contact .big:hover{color:var(--hi)}
.soc{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.soc a{padding:.6rem 1.2rem;font:600 .85rem var(--d);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,8,20,.86);backdrop-filter:blur(10px);overflow:auto;padding:calc(4.5rem + env(safe-area-inset-top,0px)) var(--pad) 3rem;touch-action:pan-y}
.modal[hidden]{display:none}
.modal .in{max-width:62rem;margin:0 auto}
.modal h2{font:700 clamp(2.6rem,8vw,6rem)/.9 var(--d);text-transform:uppercase;color:#E3EEFF;margin-bottom:.8rem}
.modal p.t{max-width:40rem;font-size:1.15rem;margin:.8rem 0 1.2rem}
.modal .shots{display:grid;gap:1rem;margin-top:1.6rem}
.modal .shots div{aspect-ratio:16/10;background:linear-gradient(135deg,#0d2250,#1b4fb8);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.4);font:700 3rem var(--d)}
.modal img{width:100%;height:100%;object-fit:cover;display:block}
.modal .x{position:fixed;top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad);padding:.5rem 1.1rem;font:600 .85rem var(--d);letter-spacing:.16em;text-transform:uppercase}

/* screen-reader / no-WebGL list */
.sr{position:absolute;left:-9999px}
.nogl,.nogl body{overflow:auto;touch-action:auto}
.nogl #gl,.nogl .dots,.nogl .nav{display:none}
.nogl .ov{position:static;opacity:1!important;visibility:visible!important;transform:none!important;padding:3rem var(--pad)}
.nogl .cap{display:none}.nogl .sr{position:static;padding:0 var(--pad) 3rem;list-style:none}
@media (max-width:760px){.about{right:var(--pad);top:auto;bottom:calc(var(--pad) + 3rem);transform:none}.dots{display:none}.nav a{padding:.35rem .5rem;font-size:.8rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="pre" aria-hidden="true"><span id="pn">0</span><i>%</i></div>
<nav class="glass nav" id="nav" aria-label="Main"></nav>
<ul class="dots" id="dots" aria-label="Sections"></ul>

<section class="ov hero" id="hero"><p class="eyebrow" id="role"></p><h1 id="name"></h1><p id="tagline"></p><p class="hint">Scroll to explore</p></section>
<section class="ov cap" id="cap"><p class="eyebrow" id="cmeta"></p><h2 id="ctitle"></h2><p id="ctags"></p><button class="btn glass" id="copen">View project</button></section>
<section class="ov about glass" id="about"></section>
<section class="ov contact" id="contact"></section>
<ul class="sr" id="sr"></ul>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Project">
  <button class="x glass" id="mx">Close</button><div class="in" id="min"></div>
</div>

<script src="content.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
